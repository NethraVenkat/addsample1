<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 400px;
        }
    </style>
</head>
<body>
    <h1>Hello, world!</h1>
    
    <div class="card">
        <h2>Welcome</h2>
        <p>This is a sample HTML page. You can add text, images, links, and more.</p>
        <a href="https://example.com">Visit Example</a>
    </div>
</body>
</html>
